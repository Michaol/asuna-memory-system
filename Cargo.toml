[package]
name = "asuna-memory"
version = "2.1.0"
edition = "2021"
description = "AI Agent Memory System - MCP Server"
readme = "README.md"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "blob", "functions"] }
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
libloading = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = "0.16"
regex-lite = "0.1"
once_cell = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "limit", "trace"] }
subtle = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
