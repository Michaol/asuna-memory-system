# SonarCloud analysis configuration.
# Executed by the `sonar` job in .github/workflows/ci.yml on pushes to main
# (SONAR_TOKEN lives in GitHub Actions secrets — never in this repo).
# Python coverage: the `plugin` job runs pytest with pytest-cov and the
# `sonar` job downloads its Cobertura report to coverage/plugin-coverage.xml
# before scanning — the Sonar way gate checks "coverage on new code", and
# without an imported report every coverable new line counts as uncovered.
# Rust coverage is NOT imported yet: without an lcov report SonarCloud
# counts no Rust lines as coverable, so the coverage metric reflects the
# Python plugin sources only (adding cargo-llvm-cov output is a possible
# follow-up — note it would enlarge the lines-to-cover denominator from the
# Python files to the whole Rust tree, which must then actually reach 80%).
sonar.projectKey=Michaol_asuna-memory-system
sonar.organization=michaol
sonar.projectName=asuna-memory-system

sonar.sources=src,hermes-plugin/ams_memory,docker
sonar.tests=tests,hermes-plugin/tests
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage/plugin-coverage.xml
