# CI gate: fmt + clippy + tests on every push/PR (review J42), hermes-plugin
# tests, Docker build smoke, and the manual #[ignore] retrieval benchmark
# runner (for_ai.md discipline, review J50).
#
# Supply-chain discipline: every third-party action below is pinned to a full
# commit SHA, reusing the exact pins already present in release.yml where the
# same action appears. Do not change a pin without verifying it resolves to
# the same release tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary (Mondays 06:00 UTC): re-runs the full gate on main and
    # additionally runs the benchmark job.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      # Same SHA pins as release.yml (verified commits, v6).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Same SHA pin as release.yml ("toolchain: stable").
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      # Same SHA pin as release.yml (v5). Caches downloaded crates only — the
      # target/ dir is intentionally not cached (size/invalidation risk).
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  plugin:
    name: Hermes plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Newest setup-python release at time of writing; SHA resolved from the
      # v7.0.0 tag via the GitHub API.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Real runtime deps (setup.py: requests>=2.28.0 — tests mock its calls
      # but import it and `requests.exceptions` for real) + pytest runner.
      # The ams_memory package itself is put on sys.path via PYTHONPATH so the
      # working tree is tested, not an installed copy.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hermes-plugin/requirements.txt pytest

      - name: Run plugin tests
        run: PYTHONPATH=hermes-plugin python -m pytest hermes-plugin/tests -q

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    # Uses the Docker CLI preinstalled on GitHub-hosted runners (no extra action).
    # The Dockerfile base image is kept in sync with Cargo.toml rust-version
    # ("1.82"), so this build smoke is expected to be green — a red docker job
    # is a real regression, not a known failure.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build image
        run: docker build -t asuna-memory:ci .

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Main-branch analysis only (plus manual dispatch): the quality-gate badge
    # tracks main; PR-branch analysis would need sonar.pullrequest keys and
    # duplicate the rust/plugin jobs' gating role.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history so SonarCloud can compute new-code periods and blame.
          fetch-depth: 0

      # SHA pin resolved from the v8.2.1 tag via the GitHub API (supply-chain
      # discipline: same policy as every other action in this file).
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bench:
    name: Retrieval benchmark (manual / weekly)
    # Only on manual dispatch and the weekly schedule; normal push/PR runs skip it.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # The only #[ignore] benchmark in the tree is
      # src/fact/bench_test.rs::test_retrieval_benchmark_baseline (keyword
      # path, no ONNX runtime needed). The `retrieval_benchmark` substring
      # filter also matches the non-ignored smoke test, but --ignored confines
      # the run to the baseline. --nocapture keeps the printed metrics visible.
      - name: Run retrieval benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -- --ignored retrieval_benchmark --nocapture \
            | tee benchmark-output.txt

      # Same SHA pin as release.yml (v7). Upload even on failure so regression
      # output is archived alongside the failing run; !cancelled() avoids a
      # second failure when the run was cancelled before the file exists.
      - name: Upload benchmark output
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: retrieval-benchmark-run-${{ github.run_id }}
          path: benchmark-output.txt
