[package]
name = "asuna-memory"
version = "3.0.0"
edition = "2021"
rust-version = "1.89"
description = "AI Agent Memory System - MCP Server"
readme = "README.md"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled", "blob", "functions", "vtab", "hooks"] }
sqlite-chinese-stopword = "0.1"
sqlite-english-stemmer = "0.1"
# 索引侧内联 FTS5 jieba tokenizer（改编自 sqlite-simple-tokenizer MIT，出处与许可证见
# NOTICE.md 与 LICENSES/sqlite-simple-tokenizer-MIT）与查询侧 OR 回退共用 util::text::shared_jieba()。
# jieba-rs 0.11 完整保留 . / _ / - 连接的 ASCII 复合词（纯中文分词不变），并在首次可写启动通过
# Schema v5/v0 -> v6 单事务自动重建 L0 turns_fts + L1 bounded_memory_fts（注：`asuna-memory sql`
# 为严格只读连接，升级后须先执行 `doctor`；`rebuild --full` 仅重建 L0 与向量，不触碰 L1）。
jieba-rs = "0.11"
sqlite-vec = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex-lite = "0.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "limit", "trace", "catch-panic", "timeout"] }
subtle = "2"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
