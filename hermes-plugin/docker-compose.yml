services:
  ams-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ams-gateway
    # W20: 优雅关闭需等在途 post-session pipeline（25s）+ runtime 排空（10s）。
    # Docker 默认 stop 宽限仅 10s，会 SIGKILL 掉已承诺的抽取工作。
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:${AMS_GATEWAY_PORT:-8765}:${AMS_GATEWAY_PORT:-8765}"
    volumes:
      - ams-data:/home/asuna/.asuna
    environment:
      - AMS_GATEWAY_PORT=${AMS_GATEWAY_PORT:-8765}
      - RUST_LOG=info
      # Non-loopback bind inside container is required for published port forwarding,
      # and non-loopback bind REQUIRES authentication.
      - AMS_GATEWAY_BIND_HOST=0.0.0.0
      - AMS_GATEWAY_API_KEY=${AMS_GATEWAY_API_KEY:?Set AMS_GATEWAY_API_KEY before starting}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${AMS_GATEWAY_PORT:-8765}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ams-data:
    driver: local
