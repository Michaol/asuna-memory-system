# CI gate: fmt + clippy + tests on every push/PR (review J42), hermes-plugin
# tests, Docker build smoke, MSRV check, and the manual #[ignore] retrieval
# benchmark runner (for_ai.md discipline, review J50).
#
# Supply-chain discipline: every third-party action below is pinned to a full
# commit SHA, reusing the exact pins already present in release.yml where the
# same action appears. Do not change a pin without verifying it resolves to
# the same release tag.
#
# C baseline pin (v3.0.0 SIGILL post-mortem): ubuntu-latest rolled to Ubuntu 26.04
# (Nov 2026), whose runner image sets APT::Architecture-Variants "amd64v3" so the
# default GCC compiles -march=x86-64-v3 (AVX2). The bundled SQLite/sqlite-vec C
# amalgamation inherited that default (repo/cc/build.rs add zero arch flags) and
# shipped unguarded AVX2 -> SIGILL on no-AVX CPUs (e.g. Celeron 3865U). rustc kept
# its SSE2 baseline so only the C init path faulted. Two defenses: (1) pin the
# runner to ubuntu-24.04 (baseline GCC 13.3, the proven v2.7.3 environment);
# (2) CFLAGS_x86_64_unknown_linux_gnu="-march=x86-64" forces the C baseline even
# if the runner image drifts again. The no-avx job below is the structural gate
# that catches any future baseline drift (native runners all have AVX2 and can
# never catch this class). Do NOT remove the pin or the CFLAGS without the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary (Mondays 06:00 UTC): re-runs the full gate on main and
    # additionally runs the benchmark job.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    steps:
      # Same SHA pins as release.yml (verified commits, v6).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Same SHA pin as release.yml ("toolchain: stable").
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      # Same SHA pin as release.yml (v5). Caches downloaded crates only — the
      # target/ dir is intentionally not cached (size/invalidation risk).
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  msrv:
    name: MSRV check (1.89)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.89
        with:
          toolchain: "1.89"

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-cargo-

      - name: Check MSRV
        run: cargo check --locked --all-targets

  plugin:
    name: Hermes plugin tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Newest setup-python release at time of writing; SHA resolved from the
      # v7.0.0 tag via the GitHub API.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          # requirements-ci.txt includes the runtime pins via `-r requirements.txt`;
          # hash both files so a runtime-only bump also invalidates the pip cache.
          cache-dependency-path: |
            hermes-plugin/requirements-ci.txt
            hermes-plugin/requirements.txt

      # Runtime deps + pytest runner + coverage plugin pinned with SHA-256 hashes.
      # Supply-chain (SonarLint S8541/S8544): enforce --require-hashes and
      # --only-binary :all: so every resolved wheel is cryptographically verified
      # and no sdist setup script ever executes.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r hermes-plugin/requirements-ci.txt

      # The Cobertura XML is consumed by the sonar job (see
      # sonar.python.coverage.reportPaths in sonar-project.properties).
      - name: Run plugin tests
        run: PYTHONPATH=hermes-plugin python -m pytest hermes-plugin/tests -q --cov=ams_memory --cov-report=xml:plugin-coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-coverage
          path: plugin-coverage.xml
          retention-days: 14

  docker:
    name: Docker build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The Dockerfile base image is kept in sync with Cargo.toml rust-version ("1.89").
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # BuildKit layer cache in the GitHub Actions cache backend (type=gha).
      # gha cache export needs the docker-container driver; buildx is
      # preinstalled on the runner, so no new third-party action pin is added.
      - name: Set up Buildx (BuildKit cache driver)
        run: docker buildx create --use --driver docker-container

      # --load exports the built image into the docker daemon for the smoke test.
      # ignore-error: a cache export failure (e.g. read-only token on fork PRs)
      # must never turn the build smoke red.
      - name: Build image
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max,ignore-error=true \
            --load \
            -t asuna-memory:ci .

      - name: Container smoke test
        run: |
          set -euo pipefail
          docker run --rm --entrypoint asuna-memory asuna-memory:ci --version
          docker run --rm --entrypoint python3 asuna-memory:ci -c "import ams_memory, requests; assert ams_memory.__version__"
          cid=$(docker run -d -p 127.0.0.1:8765:8765 \
            -e AMS_GATEWAY_BIND_HOST=0.0.0.0 \
            -e AMS_GATEWAY_API_KEY=ci-smoke-test-key \
            asuna-memory:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/health; then
              echo ""
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Main-branch analysis only (even on manual dispatch, prevent non-main branches
    # from overwriting the main SonarCloud report).
    needs: plugin
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download plugin coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plugin-coverage
          path: coverage

      # sonar.branch.name override: this SonarCloud project's main branch entry
      # is named "master" (single-branch project on a free plan).
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >
            -Dsonar.branch.name=master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bench:
    name: Retrieval benchmark (manual / weekly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # The `retrieval_benchmark` filter selects the two #[ignore] benchmarks in
      # src/fact/bench_test.rs: test_retrieval_benchmark_baseline (keyword path)
      # and test_retrieval_benchmark_expanded (54 queries / 8 strata, synthetic
      # vectors). Neither needs an external embedding API.
      - name: Run retrieval benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release -- --ignored retrieval_benchmark --nocapture \
            | tee benchmark-output.txt

      - name: Upload benchmark output
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: retrieval-benchmark-run-${{ github.run_id }}
          path: benchmark-output.txt
          retention-days: 14

  # Build the release-profile linux-x64 binary as input to the no-AVX gate.
  # MUST be --release: [profile.release] lto=true strip=true matches the shipped
  # artifact; a debug build could mask a release-only codegen regression. The
  # ubuntu-24.04 host triple is x86_64-unknown-linux-gnu, so target/release/
  # asuna-memory is byte-equivalent to the release.yml linux-x64 leg's binary.
  build-release-linux:
    name: Build release linux-x64 (no-AVX gate input)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
      - name: Build release binary
        run: cargo build --locked --release
      - name: Upload release binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asuna-memory-release-linux-x64
          path: target/release/asuna-memory
          retention-days: 7

  # no-AVX regression quadrant. Native GitHub runners all have AVX2/AVX512 and
  # can NEVER catch unguarded-VEX regressions; this job runs the release binary
  # under qemu-x86_64 -cpu qemu64 (no AVX). Pre-fix it MUST go red (doctor/sql
  # rc=132 SIGILL); post-fix all rc=0.
  #
  # qemu MUST be >= 9.0: ubuntu apt qemu-user-static 8.2.2 has a /proc/self/maps
  # vsyscall internal SIGSEGV bug (any Rust guest dies rc=139 regardless of CPU
  # model). debian:trixie ships qemu-user 10.0.13 (fixed) AND a baseline x86-64
  # glibc (Debian has no amd64v3 variant), so the container is pinned by digest.
  # rc=139 (SIGSEGV) != rc=132 (SIGILL) is the broken-emulator canary; the CPUID
  # probe self-check guards against qemu64 model drift silently disabling the
  # quadrant. No checkout step: probe.c is inlined so the minimal container needs
  # no git; download-artifact (JS) runs via the runner's mounted node externals.
  no-avx:
    name: no-AVX regression gate (qemu64)
    needs: build-release-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: debian:trixie@sha256:1c2fd3096624441883bc13fd646c376664b3ee8a990fde0f6246e567349512e9
    steps:
      - name: Install qemu-user (>= 9.0) + probe toolchain
        run: |
          apt-get update
          # qemu-user emulates the no-AVX guest; gcc + libc6-dev compile the inline
          # CPUID probe; ca-certificates lets the JS download-artifact action fetch
          # over HTTPS. --no-install-recommends keeps the minimal container small.
          apt-get install -y --no-install-recommends qemu-user gcc libc6-dev ca-certificates
      - name: Download release binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: asuna-memory-release-linux-x64
          path: bin
      - name: Quadrant self-check (qemu64 must expose NO AVX)
        run: |
          set -euo pipefail
          cat > /tmp/probe.c <<'EOF'
          #include <stdio.h>
          #include <cpuid.h>
          int main(void) {
              unsigned a = 0, b = 0, c = 0, d = 0;
              __cpuid(1, a, b, c, d);
              printf("leaf1 ECX=0x%08x OSXSAVE=%u AVX=%u SSE4.2=%u\n",
                     c, (c >> 27) & 1, (c >> 28) & 1, (c >> 20) & 1);
              if (__get_cpuid_max(0, 0) >= 7) {
                  __cpuid_count(7, 0, a, b, c, d);
                  printf("leaf7 EBX=0x%08x AVX2=%u AVX512F=%u\n",
                         b, (b >> 5) & 1, (b >> 16) & 1);
              }
              return 0;
          }
          EOF
          gcc -O2 -o /tmp/probe /tmp/probe.c
          OUT=$(qemu-x86_64 -cpu qemu64 /tmp/probe)
          echo "$OUT"
          echo "$OUT" | grep -q 'AVX=0' || { echo "FAIL: qemu64 exposes AVX - quadrant invalid"; exit 1; }
          echo "$OUT" | grep -q 'AVX2=0' || { echo "FAIL: qemu64 exposes AVX2 - quadrant invalid"; exit 1; }
      - name: no-AVX smoke (release binary must run on a no-AVX CPU)
        run: |
          set -euo pipefail
          chmod +x bin/asuna-memory
          mkdir -p /tmp/noavx/data
          printf '{"data_dir":"/tmp/noavx/data"}' > /tmp/noavx/config.json
          run() {
            rc=0
            qemu-x86_64 -cpu qemu64 bin/asuna-memory "$@" || rc=$?
            if [ "$rc" -eq 139 ]; then
              echo "FAIL: rc=139 SIGSEGV - emulator broken (qemu<9.0?), not the binary"; exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: rc=$rc (132=SIGILL unguarded VEX) for: $*"; exit 1
            fi
          }
          run --version
          run --config /tmp/noavx/config.json doctor
          run --config /tmp/noavx/config.json sql "SELECT 1"
          run serve --help
          # AVX-present control: distinguishes an AVX-specific defect from a
          # broken environment (must also pass).
          qemu-x86_64 -cpu max bin/asuna-memory --config /tmp/noavx/config.json doctor

