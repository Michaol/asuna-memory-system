# C baseline pin (v3.0.0 SIGILL post-mortem): see ci.yml header. ubuntu-latest ->
# Ubuntu 26.04 amd64v3 GCC default compiled the bundled C with unguarded AVX2.
# Defenses: pin ubuntu-24.04 + CFLAGS_x86_64_unknown_linux_gnu="-march=x86-64",
# and the no-avx-gate job below runs the SHIPPED linux-x64 artifact under
# qemu-x86_64 -cpu qemu64 (no AVX) before the release job may publish.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate: release artifacts must not ship if the suite is red (review H1).
  # Mirrors ci.yml's rust job (fmt + clippy + test) on the tag ref.
  test:
    name: Rust gate (fmt + clippy + test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Target-specific: only the x86_64-linux-gnu leg reads this; macos/windows/
      # arm64 legs use their own (baseline) compiler defaults. See ci.yml header.
      CFLAGS_x86_64_unknown_linux_gnu: "-march=x86-64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: asuna-memory-macos-apple-silicon
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: asuna-memory-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: asuna-memory-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: asuna-memory-windows-x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(grep -m1 '^version = "' Cargo.toml | cut -d'"' -f2)"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag version ($TAG_VER) does not match Cargo.toml ($PKG_VER)" >&2
            exit 1
          fi

      - name: Run unit tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p output
          # W1: package license attributions alongside the binary.
          cp NOTICE.md output/
          cp -r LICENSES output/
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/asuna-memory.exe output/
            cd output
            7z a ../${{ matrix.artifact }}.zip *
          else
            cp target/${{ matrix.target }}/release/asuna-memory output/
            cd output
            tar -czvf ../${{ matrix.artifact }}.tar.gz *
          fi

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          retention-days: 7

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 7

  # Gate the SHIPPED linux-x64 artifact on a no-AVX CPU before publishing.
  # Mirrors ci.yml's no-avx job but downloads the real packaged release artifact.
  # qemu >= 9.0 required (debian:trixie qemu-user 10.0.13, baseline glibc);
  # rc=139 != rc=132 is the broken-emulator canary; CPUID probe guards model drift.
  no-avx-gate:
    name: no-AVX release gate (qemu64)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: debian:trixie@sha256:1c2fd3096624441883bc13fd646c376664b3ee8a990fde0f6246e567349512e9
    steps:
      - name: Install qemu-user (>= 9.0) + probe toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qemu-user gcc libc6-dev ca-certificates
      - name: Download linux-x64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: asuna-memory-linux-x64
          path: dist
      - name: Quadrant self-check (qemu64 must expose NO AVX)
        run: |
          set -euo pipefail
          cat > /tmp/probe.c <<'EOF'
          #include <stdio.h>
          #include <cpuid.h>
          int main(void) {
              unsigned a = 0, b = 0, c = 0, d = 0;
              __cpuid(1, a, b, c, d);
              printf("leaf1 ECX=0x%08x OSXSAVE=%u AVX=%u SSE4.2=%u\n",
                     c, (c >> 27) & 1, (c >> 28) & 1, (c >> 20) & 1);
              if (__get_cpuid_max(0, 0) >= 7) {
                  __cpuid_count(7, 0, a, b, c, d);
                  printf("leaf7 EBX=0x%08x AVX2=%u AVX512F=%u\n",
                         b, (b >> 5) & 1, (b >> 16) & 1);
              }
              return 0;
          }
          EOF
          gcc -O2 -o /tmp/probe /tmp/probe.c
          OUT=$(qemu-x86_64 -cpu qemu64 /tmp/probe)
          echo "$OUT"
          echo "$OUT" | grep -q 'AVX=0' || { echo "FAIL: qemu64 exposes AVX - quadrant invalid"; exit 1; }
          echo "$OUT" | grep -q 'AVX2=0' || { echo "FAIL: qemu64 exposes AVX2 - quadrant invalid"; exit 1; }
      - name: no-AVX smoke on shipped artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/x
          tar -xzf dist/asuna-memory-linux-x64.tar.gz -C /tmp/x
          chmod +x /tmp/x/asuna-memory
          mkdir -p /tmp/noavx/data
          printf '{"data_dir":"/tmp/noavx/data"}' > /tmp/noavx/config.json
          rc=0
          qemu-x86_64 -cpu qemu64 /tmp/x/asuna-memory --config /tmp/noavx/config.json doctor || rc=$?
          if [ "$rc" -eq 139 ]; then echo "FAIL: rc=139 SIGSEGV - emulator broken (qemu<9.0?)"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "FAIL: no-AVX doctor rc=$rc (132=SIGILL unguarded VEX)"; exit 1; fi
          rc=0
          qemu-x86_64 -cpu qemu64 /tmp/x/asuna-memory --config /tmp/noavx/config.json sql "SELECT 1" || rc=$?
          if [ "$rc" -ne 0 ]; then echo "FAIL: no-AVX sql rc=$rc"; exit 1; fi
          qemu-x86_64 -cpu max /tmp/x/asuna-memory --config /tmp/noavx/config.json doctor

  release:
    needs: [test, build, no-avx-gate]
    if: needs.test.result == 'success' && needs.build.result == 'success' && needs.no-avx-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: dist/*
