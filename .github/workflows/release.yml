name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: asuna-memory-macos-apple-silicon
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: asuna-memory-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: asuna-memory-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: asuna-memory-windows-x64.exe
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary and ONNX Runtime library
        shell: bash
        run: |
          mkdir -p output

          # 1. Copy our compiled binary
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp target/${{ matrix.target }}/release/asuna-memory.exe output/
          else
            cp target/${{ matrix.target }}/release/asuna-memory output/
          fi

          # 2. Download ONNX Runtime dynamic library from Microsoft official releases
          ORT_VERSION="1.24.4"
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "Downloading ONNX Runtime $ORT_VERSION for Windows..."
            curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-win-x64-${ORT_VERSION}.zip" -o ort.zip
            7z x ort.zip
            cp onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime.dll output/
            cp onnxruntime-win-x64-${ORT_VERSION}/lib/onnxruntime_providers_shared.dll output/ || true
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "Downloading ONNX Runtime $ORT_VERSION for macOS (${{ matrix.target }})..."
            curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz" -o ort.tgz
            tar xzf ort.tgz
            cp onnxruntime-osx-arm64-${ORT_VERSION}/lib/libonnxruntime.dylib output/
          else
            # Linux
            if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
              ORT_ARCH="linux-aarch64"
            else
              ORT_ARCH="linux-x64"
            fi
            echo "Downloading ONNX Runtime $ORT_VERSION for Linux (${ORT_ARCH})..."
            curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-${ORT_ARCH}-${ORT_VERSION}.tgz" -o ort.tgz
            tar xzf ort.tgz
            cp onnxruntime-${ORT_ARCH}-${ORT_VERSION}/lib/libonnxruntime.so output/
          fi

          # 3. Create final archive
          cd output
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a ../${{ matrix.artifact }}.zip *
          else
            tar -czvf ../${{ matrix.artifact }}.tar.gz *
          fi

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  model:
    runs-on: ubuntu-latest
    continue-on-error: true  # Model is optional; keyword search works without it
    steps:
      - name: Cache model files
        id: cache-model
        uses: actions/cache@v5
        with:
          path: models/
          key: embeddinggemma-300m-q8-v1

      - name: Download model from HuggingFace
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_READTK }}
        run: |
          pip install -q huggingface_hub
          mkdir -p models

          # Retry with backoff — HuggingFace API rate-limits aggressively (429)
          MAX_RETRIES=5
          DELAY=30
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES (delay=${DELAY}s)..."
            if hf download \
              onnx-community/embeddinggemma-300m-ONNX \
              onnx/model_quantized.onnx \
              onnx/model_quantized.onnx_data \
              tokenizer.json \
              config.json \
              special_tokens_map.json \
              tokenizer_config.json \
              --local-dir models/raw; then
              echo "Download succeeded on attempt $i"
              break
            fi
            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "All $MAX_RETRIES attempts failed"
              exit 1
            fi
            echo "Failed, retrying in ${DELAY}s..."
            sleep "$DELAY"
            DELAY=$((DELAY * 2))
          done

          mv models/raw/onnx/model_quantized.onnx models/
          mv models/raw/onnx/model_quantized.onnx_data models/
          mv models/raw/tokenizer.json models/
          mv models/raw/config.json models/
          mv models/raw/special_tokens_map.json models/
          mv models/raw/tokenizer_config.json models/
          rm -rf models/raw

      - name: Verify model files
        run: |
          echo "Model files:"
          ls -lh models/
          echo "File count: $(ls models/ | wc -l)"

      - name: Upload model artifacts
        if: hashFiles('models/model_quantized.onnx') != ''
        uses: actions/upload-artifact@v7
        with:
          name: model-files
          path: models/*

  release:
    needs: [build, model]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/**/*
